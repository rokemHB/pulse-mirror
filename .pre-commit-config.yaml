# Install once: uv run pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^src/pulse_mirror/web/vendor/
      - id: end-of-file-fixer
        exclude: ^src/pulse_mirror/web/vendor/
      - id: trailing-whitespace
        exclude: ^src/pulse_mirror/web/vendor/
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: forbid-data-files
        name: forbid personal data files
        entry: "Refusing to commit data, tokens, databases or raw recordings."
        language: fail
        files: '(^data/|\.db$|\.sqlite|garmin_tokens/|fixtures/garmin/_raw/|^\.env$)'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
