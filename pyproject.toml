[project]
name = "pulse-mirror"
version = "0.1.0"
description = "A local mirror of your Garmin data, visualized your way – self-hosted on a Synology NAS."
readme = "README.md"
license = "MIT"
authors = [{ name = "rokemHB" }]
requires-python = ">=3.13"
dependencies = [
    # Exact pins on purpose: the Garmin login is unofficial and minor releases
    # change behaviour. Update only via reviewed Dependabot PRs (see CLAUDE.md).
    "garminconnect==0.3.20",
    "curl-cffi==0.17.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "reportlab>=5.1.2",
]

[project.scripts]
pulse-mirror = "pulse_mirror.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["garminconnect", "garminconnect.*", "reportlab", "reportlab.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
